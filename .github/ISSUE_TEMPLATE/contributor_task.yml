name: Contributor task
description: Claim or propose a scoped contribution task.
title: "chore: "
labels:
  - help wanted
  - status:ready
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What should be changed?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Suggested files or packages
      placeholder: packages/core, packages/cli, packages/viewer...
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
