name: Bug report
description: Report something that is broken or surprising.
title: "fix: "
labels:
  - type:bug
  - status:needs reproduction
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove secrets from logs and report artifacts before posting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the broken behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest command or repo state that reproduces the issue.
      placeholder: |
        1. Run `nactograph run -- ...`
        2. Open `blackbox-report.html`
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nactograph version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "v24.x"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or artifacts
      description: Paste only redacted output, JSONL excerpts, or screenshots.
