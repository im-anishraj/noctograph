ies/\n \n # Output of 'npm pack'\n *.tgz\n","hash":"sha256:9d41cc7a4261e1761ee80962b200c0be3b4ccd622fa2753423fc9c50200935d6"}},{"id":"evt_eebc55ab-b2b7-43e8-8f05-fff3b12ecfb9","ts":"2026-05-17T01:29:15.521Z","sessionId":"session_a83f7b28-bb87-4b40-9250-9d9cf92113ec","type":"FileSnapshot","payload":{"path":"README.md","phase":"after","exists":true,"content":"# Agent Blackbox\n\nLocal-first flight recorder for AI coding agents.\n\n```sh\nagent-blackbox run -- codex \"fix failing auth tests\"\n```\n\nOutputs:\n\n```text\nblackbox-report.html\nblackbox.jsonl\nblackbox-pr-comment.md\n```\n\n![Agent Blackbox report](docs/demo-report.png)\n\n## Install\n\n```sh\nnpm install -g agent-blackbox\n```\n\nRequires Node 24 or newer.\n\n## Quick Start\n\n```sh\nagent-blackbox run -- codex \"fix failing auth tests\"\ncd blackbox-sessions\nopen */blackbox-report.html\ncat */blackbox-pr-comment.md\ncat */blackbox.jsonl\n```\n\n## How It Works\n\n```mermaid\nflowchart LR\n  A[\"agent-blackbox run\"] --> B[\"PTY wrapper\"]\n  B --> C[\"Agent command\"]\n  B --> D[\"JSONL event stream\"]\n  D --> E[\"Redaction engine\"]\n  E --> F[\"Risk detector\"]\n  F --> G[\"HTML report\"]\n  F --> H[\"PR comment\"]\n```\n\nAgent Blackbox runs the agent command in a pseudo-terminal so the session still feels normal. It records command output, git snapshots, diffs, dependency changes, test runs, redaction audit summaries, and risk findings into a local session folder.\n\n## CLI\n\n```sh\nagent-blackbox run [options] -- <command...>\n```\n\n| Flag | Default | Description |\n|---|---:|---|\n| `--output-dir <dir>` | `./blackbox-sessions` | Directory for session folders and report artifacts. |\n| `--redact` | on | Redact secrets before anything is stored. |\n| `--no-redact` | off | Disable redaction for private local debugging. |\n| `--redact-patterns <path>` | none | Newline-delimited custom redaction patterns. Supports globs and `/regex/flags`. |\n\n## Reports\n\n- `blackbox-report.html`: self-contained report viewer with timeline, filters, fuzzy search, diffs, output cards, and risk findings.\n- `blackbox.jsonl`: newline-delimited validated event stream.\n- `blackbox-pr-comment.md`: Markdown summary for pull requests.\n\n## Redaction\n\nDefault redaction catches common secret files, cloud tokens, GitHub and OpenAI keys, long base64-like tokens, private IPs, and localhost URL tokens. Redaction audit entries include rule names and counts, never raw values.\n\n## Release Artifacts\n\nEach release publishes:\n\n- npm package: `agent-blackbox`\n- npm support package: `agent-blackbox-core`\n- binaries for Linux, macOS, and Windows\n\n## Contributing\n\nSee [CONTRIBUTING.md](CONTRIBUTING.md). This project uses Conventional Commits, pnpm workspaces, Vitest, React 18, Vite, and GitHub Actions.\n\n## Launch Copy\n\n> I let an AI agent fix a bug. Agent Blackbox replayed every command, every file edit, and the exact moment it broke the tests.\n\n## License\n\nMIT\n","diff":null,"hash":"sha256:4b0b5bfd738448fabc73f534afd2a2ef7e90f24c45ff65e66edecb0bc86dea97"}},{"id":"evt_909d62ee-3280-4174-9ff9-6f4c89154d93","ts":"2026-05-17T01:29:15.522Z","sessionId":"session_a83f7b28-bb87-4b40-9250-9d9cf92113ec","type":"FileSnapshot","payload":{"path":"package.json","phase":"after","exists":true,"content":"{\n  \"name\": \"noctograph\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"description\": \"Local-first flight recorder for AI coding agents.\",\n  \"license\": \"MIT\",\n  \"packageManager\": \"pnpm@9.6.0\",\n  \"engines\": {\n    \"node\": \">=24\"\n  },\n  \"scripts\": {\n    \"build\": \"pnpm -r build\",\n    \"build:binaries\": \"pnpm --filter agent-blackbox build && node -e \\\"require('fs').rmSync('dist-binaries',{recursive:true,force:true})\\\" && pnpm exec esbuild packages/cli/dist/pkg-entry.js --bundle --platform=node --format=cjs --target=node24 --define:import.meta.url=undefined --outfile=packages/cli/dist/agent-blackbox.cjs --external:node-pty && pnpm exec pkg pack li/package.json b/packages/cli/package.json\nindex 0b98eb6..f386121 100644\n--- a/packages/cli/package.json\n+++ b/packages/cli/package.json\n@@ -1,8 +1,19 @@\n {\n   \"name\": \"agent-blackbox\",\n-  \"version\": \"0.0.0\",\n+  \"version\": \"0.1.0\",\n   \"type\": \"module\",\n   \"license\": \"MIT\",\n+  \"main\": \"./dist/index.js\",\n+  \"files\": [\"dist\"],\n+  \"repository\": {\n+    \"type\": \"git\",\n+    \"url\": \"https://github.com/im-anishraj/noctograph.git\",\n+    \"directory\": \"packages/cli\"\n+  },\n+  \"homepage\": \"https://github.com/im-anishraj/noctograph#readme\",\n+  \"publishConfig\": {\n+    \"access\": \"public\"\n+  },\n   \"bin\": {\n     \"agent-blackbox\": \"./dist/index.js\"\n   },\n@@ -20,7 +31,7 @@\n     \"dev\": \"tsx src/index.ts\"\n   },\n   \"dependencies\": {\n-    \"@agent-blackbox/core\": \"workspace:*\",\n+    \"agent-blackbox-core\": \"workspace:*\",\n     \"commander\": \"^14.0.0\",\n     \"node-pty\": \"^1.1.0\",\n     \"simple-git\": \"^3.28.0\"\n","hash":"sha256:8336e2b0add5a9a7852682b03bc3f014802b1eb3463df32f6b9b953009208853"}},{"id":"evt_f3433e7c-76ec-4df8-b627-4b3c75aca890","ts":"2026-05-17T01:29:15.525Z","sessionId":"session_a83f7b28-bb87-4b40-9250-9d9cf92113ec","type":"FileSnapshot","payload":{"path":"packages/cli/src/event-writer.ts","phase":"after","exists":true,"content":"import type { BlackboxEvent } from \"agent-blackbox-core\";\nimport { blackboxEventSchema } from \"agent-blackbox-core\";\nimport { mkdir, open, type FileHandle } from \"node:fs/promises\";\nimport path from \"node:path\";\n\nexport class EventWriter {\n  private handle: FileHandle | null = null;\n\n  constructor(private readonly filePath: string) {}\n\n  get path(): string {\n    return this.filePath;\n  }\n\n  async open(): Promise<void> {\n    await mkdir(path.dirname(this.filePath), { recursive: true });\n    this.handle = await open(this.filePath, \"a\");\n  }\n\n  async write(event: BlackboxEvent): Promise<void> {\n    if (!this.handle) {\n      throw new Error(\"EventWriter must be opened before writing events.\");\n    }\n\n    const parsed = blackboxEventSchema.parse(event);\n    await this.handle.write(`${JSON.stringify(parsed)}\\n`);\n    await this.handle.sync();\n  }\n\n  async close(): Promise<void> {\n    if (!this.handle) {\n      return;\n    }\n\n    await this.handle.close();\n    this.handle = null;\n  }\n}\n","diff":"diff --git a/packages/cli/src/event-writer.ts b/packages/cli/src/event-writer.ts\nindex 63fc7e5..e5f6149 100644\n--- a/packages/cli/src/event-writer.ts\n+++ b/packages/cli/src/event-writer.ts\n@@ -1,5 +1,5 @@\n-import type { BlackboxEvent } from \"@agent-blackbox/core\";\n-import { blackboxEventSchema } from \"@agent-blackbox/core\";\n+import type { BlackboxEvent } from \"agent-blackbox-core\";\n+import { blackboxEventSchema } from \"agent-blackbox-core\";\n import { mkdir, open, type FileHandle } from \"node:fs/promises\";\n import path from \"node:path\";\n \n","hash":"sha256:0ea57631cc35f8c541a74459d5b6dbf1cf47858f57844c93ddd76a6e2e3a6e72"}},{"id":"evt_15b12fa6-21c8-46ee-a9f6-e31ec381493c","ts":"2026-05-17T01:29:15.526Z","sessionId":"session_a83f7b28-bb87-4b40-9250-9d9cf92113ec","type":"FileSnapshot","payload":{"path":"packages/cli/src/generators/html.ts","phase":"after","exists":true,"content":"import type { BlackboxEvent } from \"agent-blackbox-core\";\nimport type { SessionReportData } from \"./session.js\";\n\nexport function generateHtmlReport(data: SessionReportData): string {\n  const serialized = JSON.stringify(data).replaceAll(\"<\/script\", \"<\\\\/script\");\n  const cards = data.events.map(eventCard).join(\"\\n\");\n\n  return `<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n    <title>Agent Blackbox Report</title>\n    <style>\n      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \" 90; font-size: 12px; }\n      .event.CommandRun time { color: #9fb0cc; }\n      pre { margin: 12px 0 0; white-space: pre-wrap; overflow-x: auto; font-size: 12px; line-height: 1.5; }\n      .copy { float: right; border-radius: 6px; padding: 6px 9px; font-size: 12px; }\n    </style>\n  </head>\n  <body>\n    <main class=\"shell\">\n      <section class=\"hero\">\n        <div class=\"eyebrow\">Agent Blackbox Session</div>\n        <h1>Risk score <span class=\"risk-high\">${data.risk.score}/100</span></h1>\n        <div class=\"command\">${escapeHtml(data.command)}</div>\n      </section>\n      <section class=\"metrics\">\n        <div class=\"metric\"><span>Duration</span><strong>${(data.metrics.durationMs / 1000).toFixed(1)}s</strong></div>\n        <div class=\"metric\"><span>Files changed</span><strong>${data.metrics.filesChanged}</strong></div>\n        <div class=\"metric\"><span>Commands run</span><strong>${data.metrics.commandsRun}</strong></div>\n        <div class=\"metric\"><span>Tests</span><strong>${data.metrics.testsPassed}/${data.metrics.testsRun}</strong></div>\n      </section>\n      <section class=\"filters\" id=\"filters\"></section>\n      <section class=\"timeline\" id=\"timeline\">\n        ${cards}\n      </section>\n    </main>\n    <script>window.__BLACKBOX_SESSION__ = ${serialized};<\/script>\n    <script>\n      const filters = document.getElementById(\"filters\");\n      const eventTypes = [\"All\", ...new Set(window.__BLACKBOX_SESSION__.events.map((event) => event.type))];\n      let active = \"All\";\n      function renderFilters() {\n        filters.innerHTML = eventTypes.map((type) => '<button class=\"' + (type === active ? 'active' : '') + '\" data-type=\"' + type + '\">' + type + '</button>').join('');\n      }\n      filters.addEventListener(\"click\", (event) => {\n        const button = event.target.closest(\"button\");\n        if (!button) return;\n        active = button.dataset.type;\n        document.querySelectorAll(\".event p<string, FileChangeSummary>();\n\n  for (const event of events) {\n    if (event.type !== \"FileSnapshot\") {\n      continue;\n    }\n\n    const current = files.get(event.payload.path) ?? { path: event.payload.path, added: 0, removed: 0 };\n    const counts = diffCounts(event.payload.diff);\n    current.added += counts.added;\n    current.removed += counts.removed;\n    files.set(event.payload.path, current);\n  }\n\n  return [...files.values()].sort((a, b) => a.path.localeCompare(b.path));\n}\n\nfunction diffCounts(diff: string | null): { added: number; removed: number } {\n  const lines = (diff ?? \"\").split(/\\r?\\n/);\n  return {\n    added: lines.filter((line) => line.startsWith(\"+\") && !line.startsWith(\"+++\")).length,\n    removed: lines.filter((line) => line.startsWith(\"-\") && !line.startsWith(\"---\")).length\n  };\n}\n","diff":"diff --git a/packages/cli/src/generators/session.ts b/packages/cli/src/generators/session.ts\nindex b7c416e..ce3b251 100644\n--- a/packages/cli/src/generators/session.ts\n+++ b/packages/cli/src/generators/session.ts\n@@ -1,4 +1,4 @@\n-import { RiskDetector, type BlackboxEvent, type RiskFinding, blackboxEventSchema } from \"@agent-blackbox/core\";\n+import { RiskDetector, type BlackboxEvent, type RiskFinding, blackboxEventSchema } from \"agent-blackbox-core\";\n \n export interface FileChangeSummary {\n   path: string;\n","hash":"sha256:58b59864f35b578461bcba33a54d6996b14f5040e878cc66d6b5b267e02ef4c3"}},{"id":"evt_bef68a3f-9fff-445e-81a5-7ff5698a165f","ts":"2026-05-17T01:29:15.529Z","sessionId":"session_a83f7b28-bb87-4b40-9250-9d9cf92113ec","type":"FileSnapshot","payload":{"path":"packages/cli/src/git-snapshot.test.ts","phase":"after","exists":true,"content":"import { mkdir, writeFile } from \"node:fs/promises\";\nimport os from \"node:os\";\nimport path from \"node:path\";\nimport { simpleGit } from \"simple-git\";\nimport { describe, expect, it } from \"vitest\";\nimport { GitSnapshotter } from \"./git-snapshot.js\";\n\ndescribe(\"GitSnapshotter\", () => {\n  it(\"captures changed file content and diff\", async () => {\n    const dir = path.join(os.tmpdir(), `blackbox-git-${Date.now()}`);\n    await mkdir(dir, { recursive: true });\n    const git = simpleGit({ baseDir: dir });\n    await git.init();\n    await git.addConfig(\"user.email\", \"test@example.com\");\n    await git.addConfig(\"user.name\", \"Test User\");\n    await writeFile(path.join(dir, \"file.txt\"), \"before\\n\");\n    await git.add(\"file.txt\");\n    await git.commit(\"initial\");\n\n    await writeFile(path.join(dir, \"file.txt\"), \"after\\n\");\n    const snapshotter = new GitSnapshotter(dir);\n    const snapshots = await snapshotter.captureChangedFiles();\n\n    expect(snapshots).toHaveLength(1);\n    expect(snapshots[0]).toMatchObject({\n      path: \"file.txt\",\n      exists: true,\n      content: \"after\\n\"\n    });\n    expect(snapshots[0]?.diff).toContain(\"-before\");\n    expect(snapshots[0]?.diff).toContain(\"+after\");\n  });\n\n  it(\"ignores configured output paths\", async () => {\n    const dir = path.join(os.tmpdir(), `blackbox-git-ignore-${Date.now()}`);\n    await mkdir(path.join(dir, \"blackbox-sessions\", \"session_1\"), { recursive: true });\n    const git = simpleGit({ baseDir: dir });\n    await git.init();\n    await git.addConfig(\"user.email\", \"test@example.com\");\n    await git.addConfig(\"user.name\", \"Test User\");\n    await writeFile(path.join(dir, \"file.txt\"), \"before\\n\");\n    await git.add(\"file.txt\");\n    await git.commit(\"initial\");\n\n    await writeFile(path.join(dir, \"file.txt\"), \"after\\n\");\n    await writeFile(path.join(dir, \"blackbox-sessions\", \"session_1\", \"blackbox.jsonl\"), \"{}\\n\");\n    const snapshotter = new GitSnapshotter(dir, { ignoredPathPrefixes: [\"blackbox-sessions\"] });\n\n    expect((await snapshotter.captureChangedFiles()).map((snapshot) => snapshot.path)).toEqual([\"file.txt\"]);\n  });\n\n  it(\"skips very large file conte  path: string;\n  exists: boolean;\n  content: string | null;\n  diff: string | null;\n  hash: string | null;\n}\n\nexport class GitSnapshotter {\n  private readonly git: SimpleGit;\n  private seen = new Map<string, string | null>();\n  private readonly ignoredPathPrefixes: string[];\n  private readonly maxFileBytes: number;\n\n  constructor(\n    private readonly cwd: string,\n    options: { ignoredPathPrefixes?: string[] } = {}\n  ) {\n    this.git = simpleGit({ baseDir: cwd, binary: \"git\" });\n    this.ignoredPathPrefixes = (options.ignoredPathPrefixes ?? []).map(normalizePath);\n    this.maxFileBytes = 1_000_000;\n  }\n\n  async baselineHash(): Promise<string | null> {\n    try {\n      return (await this.git.revparse([\"HEAD\"])).trim();\n    } catch {\n      return null;\n    }\n  }\n\n  async changedFiles(): Promise<string[]> {\n    let status;\n    try {\n      status = await this.git.status();\n    } catch {\n      return [];\n    }\n\n    return [...new Set([...status.modified, ...status.created, ...status.deleted, ...status.not_added, ...status.renamed.map((item) => item.to)])]\n      .filter((file) => !this.isIgnored(file))\n      .sort();\n  }\n\n  async captureChangedFiles(): Promise<FileSnapshotData[]> {\n    const files = await this.changedFiles();\n    const snapshots: FileSnapshotData[] = [];\n\n    for (const file of files) {\n      const snapshot = await this.captureFile(file);\n      if (this.seen.get(file) !== snapshot.hash) {\n        this.seen.set(file, snapshot.hash);\n        snapshots.push(snapshot);\n      }\n    }\n\n    return snapshots;\n  }\n\n  private async captureFile(file: string): Promise<FileSnapshotData> {\n    const absolute = path.join(this.cwd, file);\n    let content: string | null = null;\n    let exists = true;\n\n    try {\n      const fileStat = await stat(absolute);\n      content = fileStat.size > this.maxFileBytes ? \"[SKIPPED:file too large]\" : await readFile(absolute, \"utf8\");\n    } catch {\n      exists = false;\n    }\n\n    const hash = content === null ? null : `sha256:${createHash(\"sha256\").update(content).digest(\"hex\")}`;\n    const diff = await this.diffFor(file, exists);\n\n    return { path: file, exists, content, diff, hash };\n  }\n\n  private async diffFor(file: string, exists: boolean): Promise<string | null> {\n    try {\n      const diff = exists ? await this.git.diff([\"--\", file]) : await this.git.diff([\"--cached\", \"--\", file]);\n      return diff.trim().length > 0 ? diff : null;\n    } catch {\n      return null;\n    }\n  }\n\n  private isIgnored(file: string): boolean {\n    const normalized = normalizePath(file);\n    return this.ignoredPathPrefixes.some((prefix) => normalized === prefix || normalized.startsWith(`${prefix}/`));\n  }\n}\n\nfunction normalizePath(value: string): string {\n  return value.replaceAll(\"\\\\\", \"/\").replace(/\\/+$/, \"\");\n}\n","diff":"diff --git a/packages/cli/src/git-snapshot.ts b/packages/cli/src/git-snapshot.ts\nindex 10fdc79..bac1e7c 100644\n--- a/packages/cli/src/git-snapshot.ts\n+++ b/packages/cli/src/git-snapshot.ts\n@@ -1,5 +1,5 @@\n import { createHash } from \"node:crypto\";\n-import { readFile } from \"node:fs/promises\";\n+import { readFile, stat } from \"node:fs/promises\";\n import path from \"node:path\";\n import { simpleGit, type SimpleGit } from \"simple-git\";\n \n@@ -15,6 +15,7 @@ export class GitSnapshotter {\n   private readonly git: SimpleGit;\n   private seen = new Map<string, string | null>();\n   private readonly ignoredPathPrefixes: string[];\n+  private readonly maxFileBytes: number;\n \n   constructor(\n     private readonly cwd: string,\n@@ -22,6 +23,7 @@ export class GitSnapshotter {\n   ) {\n     this.git = simpleGit({ baseDir: cwd, binary: \"git\" });\n     this.ignoredPathPrefixes = (options.ignoredPathPrefixes ?? []).map(normalizePath);\n+    this.maxFileBytes = 1_000_000;\n   }\n \n   async baselineHash(): Promise<string | null> {\n@@ -66,7 +68,8 @@ export class GitSnapshot const redactionEngine = options.redact ? new RedactionEngine({ customPatterns: options.redactPatterns }) : null;\n  const redactText = (value: string) => redactionEngine?.redactText(value).text ?? value;\n  const redactFileContent = (filePath: string, value: string | null) => {\n    if (value === null) {\n      return null;\n    }\n\n    return redactionEngine?.redactFileContent(filePath, value).text ?? value;\n  };\n\n  let ptyHandle: PtyHandle | null = null;\n  let closed = false;\n  let exitCode: number | null = null;\n  let signal: string | null = null;\n  let snapshotFlush = Promise.resolve();\n\n  const writeEvent = async (type: BlackboxEventType, payload: BlackboxEvent[\"payload\"]) => {\n    await writer.write({\n      id: `evt_${randomUUID()}`,\n      ts: new Date().toISOString(),\n      sessionId,\n      type,\n      payload\n    } as BlackboxEvent);\n  };\n\n  const flushSnapshots = async (force = false) => {\n    if (closed && !force) {\n      return;\n    }\n\n    const snapshots = await snapshotter.captureChangedFiles();\n    for (const snapshot of snapshots) {\n      await writeEvent(\"FileSnapshot\", {\n        path: snapshot.path,\n        phase: \"after\",\n        exists: snapshot.exists,\n        content: redactFileContent(snapshot.path, snapshot.content),\n        diff: redactFileContent(snapshot.path, snapshot.diff),\n        hash: snapshot.hash\n      });\n    }\n  };\n\n  const queueSnapshotFlush = () => {\n    snapshotFlush = snapshotFlush.then(() => flushSnapshots()).catch(async (cause: unknown) => {\n      if (!closed) {\n        await writeEvent(\"ErrorEvent\", {\n          name: cause instanceof Error ? cause.name : \"SnapshotError\",\n          message: cause instanceof Error ? cause.message : \"Snapshot flush failed\",\n          stack: cause instanceof Error ? cause.stack : undefined\n        });\n      }\n    });\n\n    return snapshotFlush;\n  };\n\n  const finish = async () => {\n    if (closed) {\n      return;\n    }\n\n    closed = true;\n    clearInterval(pollTimer);\n    process.stdin.off(\"data\", onStdin);\n    process.stdout.off(\"resize\", onResize);\n    process.off(\"SIGINT\", onSignal);\n    process.off(\"SIGTERM\", onSignal);\n\n    await snapshotFlush;\n    await flushSnapshots(true);\n    if (redactionEngine) {\n      await writeEvent(\"AgentMessage\", {\n        role: \"system\",\n        text: `Redaction audit: ${JSON.stringify(redactionEngine.auditLog())}`\n      });\n    }\n\n    await writeEvent(\"SessionEnd\", {\n      exitCode,\n      signal,\n      durationMs: Date.now() - startedAt\n    });\n    await writer.close();\n  };\n\n  const onStdin = (data: Buffer) => {\n    ptyHandle?.write(data.toString());\n  };\n\n  const onResize = () => {\n    ptyHandle?.resize(process.stdout.columns || 120, process.stdout.rows || 30);\n  };\n\n  const onSignal = (receivedSignal: NodeJS.Signals) => {\n    signal = receivedSignal;\n    ptyHandle?.kill(receivedSignal);\n  };\n\n  await writeEvent(\"SessionStart\", {\n    command: options.command.map(redactText),\n    cwd: options.cwd,\n    gitHead,\n    outputDir: sessionDir,\n    redact: options.redact\n  });\n\n  await writeEvent(\"CommandRun\", {\n    command: redactText(options.command[0] ?? \"\"),\n    args: options.command.slice(1).map(redactText),\n    cwd: options.cwd\n  });\n\n  const pollTimer = setInterval(() => {\n    void queueSnapshotFlush();\n  }, options.pollIntervalMs ?? 2000);\n\n  process.stdin.on(\"data\", onStdin);\n  process.stdout.on(\"resize\", onResize);\n  process.on(\"SIGINT\", onSignal);\n  process.on(\"SIGTERM\", onSignal);\n\n  const result = await new Promise<RunResult>((resolve) => {\n    ptyHandle = createPty(options.command, {\n      cwd: options.cwd,\n      onData: async (data) => {\n        process.stdout.write(data);\n        await writeEvent(\"CommandOutput\", {\n          stream: \"stdout\",\n          text: redactText(stripAnsi(data)),\n          raw: redactText(data),\n          truncated: false\n        });\n      },\n      onExit: async (exit) => {\n        exitCode = exit.exitCode;\n        signal ??= exit.signal === undefined ? null : String(exit.signal);\n        await finish();\n        const artifacts = await generateReportArtifacts(writer.path);\n        resolve({ exitCode, signal, sessionId, jsonlPath: writer.path, ...artifacts });\n      }\n    });\n  });\n\n  return result;\n}\n","diff":"diff --git a/packages/cli/src/run.ts b/packages/cli/src/run.ts\nindex ce1c4cf..aa54d44 100644\n--- a/packages/cli/src/run.ts\n+++ b/packages/cli/src/run.ts\n@@ -1,4 +1,4 @@\n-import { RedactionEngine, type BlackboxEvent, type BlackboxEventType } from \"@agent-blackbox/core\";\n+import { RedactionEngine, type BlackboxEvent, type BlackboxEventType } from \"agent-blackbox-core\";\n import { randomUUID } from \"node:crypto\";\n import { mkdir } from \"node:fs/promises\";\n import path from \"node:path\";\n@@ -56,6 +56,7 @@ export async function runBlackbox(options: RunOptions): Promise<RunResult> {\n   let closed = false;\n   let exitCode: number | null = null;\n   let signal: string | null = null;\n+  let snapshotFlush = Promise.resolve();\n \n   const writeEvent = async (type: BlackboxEventType, payload: BlackboxEvent[\"payload\"]) => {\n     await writer.write({\n@@ -67,7 +68,11 @@ export async function runBlackbox(options: RunOptions): Promise<RunResult> {\n     } as BlackboxEvent);\n   };\n \n-  const flushSnapshots = async () => {\n+  const flushSnapshots = async (force = false) => {\n+    if (closed && !force) {\n+      return;\n+    }\n+\n     const snapshots = await snapshotter.captureChangedFiles();\n     for (const snapshot of snapshots) {\n       await writeEvent(\"FileSnapshot\", {\n@@ -81,6 +86,20 @@ export async function runBlackbox(options: RunOptions): Promise<RunResult> {\n     }\n   };\n \n+  const queueSnapshotFlush = () => {\n+    snapshotFlush = snapshotFlush.then(() => flushSnapshots()).catch(async (cause: unknown) => {\n+      if (!closed) {\n+ apshot","payload":{"path":"packages/viewer/src/App.tsx","phase":"after","exists":true,"content":"import Fuse from \"fuse.js\";\nimport { useMemo, useState } from \"react\";\nimport type { BlackboxEvent, BlackboxEventType, RiskSeverity } from \"agent-blackbox-core\";\nimport { EventTimeline } from \"./components/EventTimeline.js\";\nimport { FilterBar } from \"./components/FilterBar.js\";\nimport { RiskSidebar } from \"./components/RiskSidebar.js\";\nimport { SessionHeader } from \"./components/SessionHeader.js\";\nimport { createSessionReportData, parseJsonlEvents } from \"./session.js\";\nimport type { SessionReportData } from \"./types.js\";\n\nconst severityRank: Record<RiskSeverity, number> = { high: 0, medium: 1, low: 2 };\n\nexport function App() {\n  const [session, setSession] = useState<SessionReportData | null>(() => window.__BLACKBOX_SESSION__ ?? null);\n  const [eventType, setEventType] = useState<BlackboxEventType | \"All\">(\"All\");\n  const [severity, setSeverity] = useState<RiskSeverity | \"All\">(\"All\");\n  const [query, setQuery] = useState(\"\");\n  const [error, setError] = useState<string | null>(null);\n\n  const filteredEvents = useMemo(() => {\n    if (!session) {\n      return [];\n    }\n\n    const byType = session.events.filter((event) => eventType === \"All\" || event.type === eventType);\n    if (query.trim().length === 0) {\n      return byType;\n    }\n\n    return new Fuse(byType, {\n      includeScore: true,\n      threshold: 0.32,\n      keys: [\"type\", \"payload\"]\n    })\n      .search(query)\n      .map((result) => result.item);\n  }, [eventType, query, session]);\n\n  const findings = useMemo(() => {\n    if (!session) {\n      return [];\n    }\n\n    return session.risk.findings\n      .filter((finding) => severity === \"All\" || finding.severity === severity)\n      .sort((a, b) => severityRank[a.severity] - severityRank[b.severity]);\n  }, [session, severity]);\n\n  async function loadFile(file: File) {\n    try {\n      setError(null);\n      setSession(createSessionReportData(parseJsonlEvents(await file.text())));\n    } catch (cause) {\n      setError(cause instanceof Error ? cause.message : \"Unable to load session.\");\n    }\n  }\n\n  if (!session) {\n    return (\n      <main\n        className=\"empty\"\n        onDragOver={(event) => event.preventDefault()}\n        onDrop={(event) => {\n          event.preventDefault();\n          const file = event.dataTransfer.files.item(0);\n          if (file) void loadFile(file);\n        }}\n      >\n        <label className=\"dropZone\">\n          <input\n            type=\"file\"\n            accept=\".jsonl,application/jsonl,text/plain\"\n            onChange={(event) => {\n              const file = event.currentTarget.files?.item(0);\n              if (file) void loadFile(file);\n            }}\n          />\n          <span>Drop a session JSONL</span>\n        </label>\n        {error ? <p className=\"error\">{error}</p> : null}\n      </main>\n    );\n  }\n\n  return (\n    <main className=\"appShell\">\n      <SessionHeader session={session} />\n      <FilterBar\n        events={session.events}\n        eventType={eventType}\n        severity={severity}\n        query={query}\n        onEventTypeChange={setEventType}\n        onSeverityChange={setSeverity}\n        onQueryChange={setQuery}\n      />\n      <section className=\"contentGrid\">\n        <RiskSidebar findings={findings} />\n        <EventTimeline events={filteredEvents} />\n      </section>\n    </main>\n  );\n}\n","diff":"diff --git a/packages/viewer/src/App.tsx b/packages/viewer/src/App.tsx\nindex 5aca941..f17aeaa 100644\n--- a/packages/viewer/src/App.tsx\n+++ b/packages/viewer/src/App.tsx\n@@ -1,6 +1,6 @@\n import Fuse from \"fuse.js\";\n import { useMemo, useState } from \"react\";\n-import type { BlackboxEvent, BlackboxEventType, RiskSeverity } from \"@agent-blackbox/core\";\n+import type { BlackboxEvent, BlackboxEventType, RiskSeverity } from \"agent-bl .length,\n      testsPassed: tests.filter((event) => event.payload.status === \"passed\").length,\n      testsFailed: tests.filter((event) => event.payload.status === \"failed\").length\n    },\n    files,\n    command: sessionStart?.payload.command.join(\" \") ?? \"unknown command\"\n  };\n}\n\nfunction summarizeFiles(events: BlackboxEvent[]): FileChangeSummary[] {\n  const files = new Map<string, FileChangeSummary>();\n\n  for (const event of events) {\n    if (event.type !== \"FileSnapshot\") {\n      continue;\n    }\n\n    const current = files.get(event.payload.path) ?? { path: event.payload.path, added: 0, removed: 0 };\n    const diff = event.payload.diff ?? \"\";\n    current.added += diff.split(/\\r?\\n/).filter((line) => line.startsWith(\"+\") && !line.startsWith(\"+++\")).length;\n    current.removed += diff.split(/\\r?\\n/).filter((line) => line.startsWith(\"-\") && !line.startsWith(\"---\")).length;\n    files.set(event.payload.path, current);\n  }\n\n  return [...files.values()].sort((a, b) => a.path.localeCompare(b.path));\n}\n","diff":"diff --git a/packages/viewer/src/session.ts b/packages/viewer/src/session.ts\nindex 7862634..b21caca 100644\n--- a/packages/viewer/src/session.ts\n+++ b/packages/viewer/src/session.ts\n@@ -1,4 +1,4 @@\n-import { RiskDetector, blackboxEventSchema, type BlackboxEvent } from \"@agent-blackbox/core\";\n+import { RiskDetector, blackboxEventSchema, type BlackboxEvent } from \"agent-blackbox-core\";\n import type { FileChangeSummary, SessionReportData } from \"./types.js\";\n \n export function parseJsonlEvents(jsonl: string): BlackboxEvent[] {\n","hash":"sha256:a0030096169dbe2c198791e52753ce43ee995063787b7bd5170baa7ac3b28762"}},{"id":"evt_f79a46da-033c-4122-b308-9934f55a43dd","ts":"2026-05-17T01:29:15.544Z","sessionId":"session_a83f7b28-bb87-4b40-9250-9d9cf92113ec","type":"FileSnapshot","payload":{"path":"packages/viewer/src/types.ts","phase":"after","exists":true,"content":"import type { BlackboxEvent, RiskFinding } from \
